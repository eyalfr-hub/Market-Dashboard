<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Dashboard - תמונת מצב יומית לשוק</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Google Fonts: Heebo & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Heebo', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#EBF2F7',
              card: '#FFFFFF',
              dark: '#0F172A',
              cyan: '#00BCD4',
              blue: '#2563EB',
              purple: '#7C3AED',
              orange: '#F59E0B',
              red: '#EF4444',
              green: '#10B981',
            }
          },
          borderRadius: {
            '2xl': '1.25rem',
            '3xl': '1.75rem',
          },
          boxShadow: {
            'card': '0 10px 25px -5px rgba(100, 116, 139, 0.08), 0 4px 10px -2px rgba(100, 116, 139, 0.04)',
            'card-hover': '0 20px 30px -10px rgba(100, 116, 139, 0.15)',
            'glow-cyan': '0 8px 25px -4px rgba(0, 188, 212, 0.35)',
            'glow-red': '0 8px 25px -4px rgba(239, 68, 68, 0.35)',
            'glow-orange': '0 8px 25px -4px rgba(245, 158, 11, 0.35)',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #EBF2F7;
      font-family: 'Heebo', 'Inter', sans-serif;
      color: #1e293b;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .badge-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
  </style>
</head>
<body class="p-3 md:p-6 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MarketApp() {
      const [marketData, setMarketData] = useState(null);
      const [selectedIndex, setSelectedIndex] = useState('nasdaq'); // 'nasdaq' or 'sp500'
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [chartRange, setChartRange] = useState(60); // 30, 60, 120 days
      const [activeMAs, setActiveMAs] = useState({
        sma10: true,
        ema21: true,
        sma50: true,
        sma200: true
      });
      const [toast, setToast] = useState('');

      const chartCanvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const loadData = async (forceRefresh = false) => {
        if (forceRefresh) setRefreshing(true);
        try {
          const endpoint = forceRefresh ? '/api/refresh' : '/api/market-data';
          const method = forceRefresh ? 'POST' : 'GET';
          const resp = await fetch(endpoint, { method });
          const json = await resp.json();
          if (json.status === 'success' && json.data) {
            setMarketData(json.data);
            if (forceRefresh) {
              showToast('נתוני השוק רועננו בהצלחה!');
            }
          }
        } catch (err) {
          console.error("Error loading market data:", err);
          showToast('שגיאה בטעינת נתונים');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      const currentData = marketData ? marketData[selectedIndex] : null;

      useEffect(() => {
        if (!chartCanvasRef.current || !currentData || !currentData.chart_data) return;

        const cData = currentData.chart_data;
        const totalPoints = cData.labels.length;
        const sliceCount = Math.min(chartRange, totalPoints);
        const startIndex = totalPoints - sliceCount;

        const labels = cData.labels.slice(startIndex);
        const prices = cData.close.slice(startIndex);
        const sma10 = cData.sma10.slice(startIndex);
        const ema21 = cData.ema21.slice(startIndex);
        const sma50 = cData.sma50.slice(startIndex);
        const sma200 = cData.sma200.slice(startIndex);

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartCanvasRef.current.getContext('2d');
        const gradientPrice = ctx.createLinearGradient(0, 0, 0, 320);
        gradientPrice.addColorStop(0, 'rgba(0, 188, 212, 0.28)');
        gradientPrice.addColorStop(1, 'rgba(0, 188, 212, 0.01)');

        const datasets = [
          {
            label: `${currentData.symbol_ticker} - מחיר סגירה`,
            data: prices,
            borderColor: '#00BCD4',
            backgroundColor: gradientPrice,
            borderWidth: 2.8,
            fill: true,
            tension: 0.15,
            pointRadius: sliceCount > 60 ? 0 : 2.5,
            pointHoverRadius: 6,
            pointBackgroundColor: '#00BCD4',
            pointBorderColor: '#FFFFFF',
            order: 4
          }
        ];

        if (activeMAs.sma10) {
          datasets.push({
            label: '10 SMA',
            data: sma10,
            borderColor: '#F59E0B',
            borderWidth: 2,
            borderDash: [3, 3],
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            order: 3
          });
        }

        if (activeMAs.ema21) {
          datasets.push({
            label: '21 EMA (קו מנחה מרכזי)',
            data: ema21,
            borderColor: '#8B5CF6',
            borderWidth: 2.4,
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            order: 2
          });
        }

        if (activeMAs.sma50) {
          datasets.push({
            label: '50 SMA (מוסדי)',
            data: sma50,
            borderColor: '#3B82F6',
            borderWidth: 2.2,
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            order: 1
          });
        }

        if (activeMAs.sma200) {
          datasets.push({
            label: '200 SMA (טווח ארוך)',
            data: sma200,
            borderColor: '#64748B',
            borderWidth: 1.8,
            borderDash: [5, 4],
            fill: false,
            tension: 0.2,
            pointRadius: 0,
            order: 5
          });
        }

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                display: false
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                titleFont: { size: 13, weight: 'bold' },
                bodyFont: { size: 12 },
                padding: 12,
                cornerRadius: 12,
                callbacks: {
                  label: function(c) {
                    const val = c.parsed.y;
                    if (val === null || val === undefined) return '';
                    return ` ${c.dataset.label}: ${val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: {
                  color: '#94a3b8',
                  font: { weight: '600', size: 11 },
                  maxTicksLimit: 10
                }
              },
              y: {
                position: 'left',
                grid: { color: 'rgba(226, 232, 240, 0.7)' },
                ticks: {
                  color: '#94a3b8',
                  font: { weight: '600', size: 11 },
                  callback: val => val.toLocaleString()
                }
              }
            }
          }
        });
      }, [currentData, chartRange, activeMAs]);

      if (loading) {
        return (
          <div className="flex flex-col items-center justify-center min-h-[80vh] space-y-4">
            <div className="w-14 h-14 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
            <p className="text-slate-600 font-semibold text-lg">טוען נתוני שוק ומחשב ממוצעים נעים...</p>
          </div>
        );
      }

      if (!currentData) {
        return (
          <div className="text-center py-20 bg-white rounded-3xl p-8 max-w-xl mx-auto shadow-card">
            <h3 className="text-xl font-bold text-slate-800 mb-2">אין נתונים זמינים כרגע</h3>
            <p className="text-slate-500 mb-6">לא ניתן לטעון את נתוני המדדים. אנא נסה לרענן שוב.</p>
            <button
              onClick={() => loadData(true)}
              className="bg-cyan-500 hover:bg-cyan-600 text-white font-bold px-6 py-2.5 rounded-full transition shadow-md"
            >
              רענן נתונים עכשיו
            </button>
          </div>
        );
      }

      const nasdaq = marketData.nasdaq;
      const sp500 = marketData.sp500;
      const isPositive = currentData.daily_change_pct >= 0;
      const isOverextended = currentData.flags.is_overextended;

      return (
        <div className="max-w-[1520px] mx-auto space-y-5">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white px-6 py-3 rounded-full text-sm font-semibold shadow-2xl flex items-center gap-2 backdrop-blur-md border border-slate-700">
              <span className="text-cyan-400">✓</span>
              <span>{toast}</span>
            </div>
          )}

          {/* Header Bar */}
          <div className="flex flex-wrap items-center justify-between gap-4 bg-white/80 backdrop-blur-md px-6 py-4 rounded-3xl border border-slate-200/80 shadow-card">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-glow-cyan shrink-0">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
                  Market Dashboard
                  <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-medium border border-slate-200">
                    Market School
                  </span>
                </h1>
                <p className="text-xs text-slate-500 font-medium">
                  תמונת מצב יומית למדד המרכזי • עודכן לתאריך: <span className="font-bold text-slate-700">{currentData.last_updated}</span>
                </p>
              </div>
            </div>

            {/* Index Switcher */}
            <div className="flex items-center bg-slate-100/90 p-1.5 rounded-2xl border border-slate-200 shadow-inner">
              <button
                onClick={() => setSelectedIndex('nasdaq')}
                className={`flex items-center gap-3 px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 ${
                  selectedIndex === 'nasdaq'
                    ? 'bg-white text-slate-900 shadow-md scale-[1.02]'
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                }`}
              >
                <span>נאסד"ק (^IXIC)</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${
                  nasdaq.daily_change_pct >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                }`}>
                  {nasdaq.daily_change_pct >= 0 ? '+' : ''}{nasdaq.daily_change_pct}%
                </span>
              </button>

              <button
                onClick={() => setSelectedIndex('sp500')}
                className={`flex items-center gap-3 px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 ${
                  selectedIndex === 'sp500'
                    ? 'bg-white text-slate-900 shadow-md scale-[1.02]'
                    : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                }`}
              >
                <span>S&P 500 (^GSPC)</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${
                  sp500.daily_change_pct >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                }`}>
                  {sp500.daily_change_pct >= 0 ? '+' : ''}{sp500.daily_change_pct}%
                </span>
              </button>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => loadData(true)}
                disabled={refreshing}
                className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-2xl text-xs font-bold transition shadow-sm disabled:opacity-50"
              >
                <svg
                  className={`w-4 h-4 ${refreshing ? 'animate-spin' : ''}`}
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>{refreshing ? 'מרענן...' : 'רענן נתונים'}</span>
              </button>
            </div>
          </div>

          {/* Overextended Alert Banner */}
          {isOverextended ? (
            <div className="bg-gradient-to-r from-amber-500/15 via-orange-500/10 to-red-500/15 border-2 border-orange-400/60 rounded-3xl p-4 md:p-5 shadow-card flex items-start gap-4">
              <div className="w-12 h-12 rounded-2xl bg-orange-500 text-white flex items-center justify-center shrink-0 shadow-glow-orange badge-pulse">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
              </div>
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-2">
                  <h3 className="text-base font-black text-slate-900">
                    התראת מתיחת יתר (Extended Market Flag)
                  </h3>
                  {currentData.flags.flag_21 && (
                    <span className="bg-orange-500 text-white text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm">
                      מתיחה מעל 21 EMA: {currentData.moving_averages.dist_21_pct}% (סף: 5.0%+)
                    </span>
                  )}
                  {currentData.flags.flag_50 && (
                    <span className="bg-red-500 text-white text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm">
                      מתיחה מעל 50 SMA: {currentData.moving_averages.dist_50_pct}% (סף: 7.0%+)
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-700 leading-relaxed font-medium">
                  לפי כללי Market School, השוק נמתח משמעותית מעבר לממוצעי המפתח. בסביבה זו יחס הסיכוי/סיכון לרכישות חדשות נחלש, וישנה סבירות מוגברת למימוש רווחים (Pullback) או להתכנסות רוחבית לבדיקת ממוצעים. מומלץ להימנע מרדיפה אחר מניות מתוחות ולהדק ניהול סיכונים.
                </p>
              </div>
            </div>
          ) : (
            <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-3xl p-3.5 px-6 shadow-sm flex items-center gap-3">
              <span className="w-8 h-8 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-black text-sm shrink-0">
                ✓
              </span>
              <p className="text-xs text-emerald-900 font-semibold">
                מצב ממוצעים תקין: המדד אינו נמצא במתיחת יתר קיצונית מעל ממוצעי המפתח (מתחת ל-5% מ-21 EMA ומתחת ל-7% מ-50 SMA).
              </p>
            </div>
          )}

          {/* 4 KPIs Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-card hover:shadow-card-hover transition-all">
              <div className="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
                <span>ערך המדד ({currentData.symbol_ticker})</span>
                <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">יומי</span>
              </div>
              <div className="flex items-baseline gap-2 mb-2">
                <span className="text-3xl font-black text-slate-900 font-sans tracking-tight">
                  {currentData.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                </span>
              </div>
              <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                <span className={`inline-flex items-center gap-1 text-sm font-black px-2.5 py-1 rounded-xl ${
                  isPositive ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'
                }`}>
                  {isPositive ? '▲ +' : '▼ '}
                  {currentData.daily_change_pts} ({isPositive ? '+' : ''}{currentData.daily_change_pct}%)
                </span>
                <span className="text-xs text-slate-500 font-medium font-sans">
                  טווח: {currentData.low.toLocaleString()} - {currentData.high.toLocaleString()}
                </span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-card hover:shadow-card-hover transition-all">
              <div className="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
                <span>שיא שנתי (52W High)</span>
                {currentData.is_new_high ? (
                  <span className="bg-emerald-500 text-white text-[11px] font-black px-2.5 py-0.5 rounded-full shadow-sm animate-pulse">
                    🏆 שיא חדש!
                  </span>
                ) : (
                  <span className="bg-slate-100 text-slate-600 text-[11px] font-semibold px-2 py-0.5 rounded-full">
                    ללא שיא היום
                  </span>
                )}
              </div>
              <div className="flex items-baseline gap-2 mb-2">
                <span className="text-3xl font-black text-slate-900 font-sans tracking-tight">
                  {currentData.high_52w.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                </span>
              </div>
              <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                <span className="text-xs text-slate-600 font-medium">מרחק מהשיא:</span>
                <span className={`text-sm font-black font-sans px-2.5 py-0.5 rounded-xl ${
                  currentData.off_52w_high_pct >= -1.0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-700'
                }`}>
                  {currentData.off_52w_high_pct > 0 ? '+' : ''}{currentData.off_52w_high_pct}%
                </span>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-card hover:shadow-card-hover transition-all">
              <div className="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
                <span>איכות סגירה (Closing Range)</span>
                <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${
                  currentData.closing_range.status === 'strong' ? 'bg-emerald-100 text-emerald-700' :
                  currentData.closing_range.status === 'neutral' ? 'bg-amber-100 text-amber-700' :
                  'bg-rose-100 text-rose-700'
                }`}>
                  {currentData.closing_range.pct}%
                </span>
              </div>
              <div className="flex items-baseline gap-2 mb-2">
                <span className="text-2xl font-black text-slate-900">
                  {currentData.closing_range.status === 'strong' ? 'סגירה חזקה (איסוף)' :
                   currentData.closing_range.status === 'neutral' ? 'סגירה ניטרלית' : 'סגירה חלשה (לחץ)'}
                </span>
              </div>
              
              <div className="pt-2 border-t border-slate-100 space-y-1">
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden flex">
                  <div
                    className={`h-full transition-all duration-500 rounded-full ${
                      currentData.closing_range.pct >= 70 ? 'bg-emerald-500' :
                      currentData.closing_range.pct >= 40 ? 'bg-amber-500' : 'bg-rose-500'
                    }`}
                    style={{ width: `${Math.min(100, Math.max(0, currentData.closing_range.pct))}%` }}
                  ></div>
                </div>
                <div className="flex justify-between text-[10px] text-slate-500 font-semibold font-sans">
                  <span>נמוך (0%)</span>
                  <span>אמצע (50%)</span>
                  <span>גבוה (100%)</span>
                </div>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-card hover:shadow-card-hover transition-all">
              <div className="flex items-center justify-between text-xs text-slate-500 font-bold mb-1">
                <span>רצף ימים (Low &gt; 21 EMA)</span>
                <span className="text-[11px] bg-purple-50 text-purple-700 font-bold px-2 py-0.5 rounded-full border border-purple-200/50">
                  ספירת רצף
                </span>
              </div>
              <div className="flex items-baseline gap-2 mb-2">
                <span className="text-3xl font-black text-purple-600 font-sans tracking-tight">
                  {currentData.days_low_above_21}
                </span>
                <span className="text-sm font-bold text-slate-600">ימי מסחר רצופים</span>
              </div>
              <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 font-medium">
                <span>הנמוך היומי החזיק מעל ה-21 EMA</span>
                <span className="font-bold text-slate-700 font-sans">
                  {currentData.moving_averages.ema21.toLocaleString()}
                </span>
              </div>
            </div>
          </div>

          {/* Moving Averages Matrix */}
          <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center font-black">
                  MA
                </div>
                <div>
                  <h2 className="text-lg font-black text-slate-900">
                    ממוצעים נעים, מרחקים ומתיחות (Market School Matrix)
                  </h2>
                  <p className="text-xs text-slate-500 font-medium">
                    מעקב מרחקים מהממוצעים הנעים והתראות מתיחה מעל 5% מה-21 ו-7% מה-50
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500 font-bold">סדר ממוצעים:</span>
                <span className={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm ${
                  currentData.ma_order.is_bullish
                    ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                    : 'bg-amber-100 text-amber-800 border border-amber-200'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${currentData.ma_order.is_bullish ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                  {currentData.ma_order.alignment_status}
                </span>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3.5 pt-1">
              <div className="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/70 space-y-2">
                <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    10 SMA
                  </span>
                  <span className="font-sans font-semibold text-slate-700">
                    {currentData.moving_averages.sma10.toLocaleString()}
                  </span>
                </div>
                <div className="text-2xl font-black text-slate-900 font-sans">
                  {currentData.moving_averages.dist_10_pct > 0 ? '+' : ''}{currentData.moving_averages.dist_10_pct}%
                </div>
                <p className="text-[11px] text-slate-500">מומנטום קצר טווח</p>
              </div>

              <div className={`p-4 rounded-2xl border transition-all space-y-2 ${
                currentData.flags.flag_21
                  ? 'bg-orange-50/90 border-orange-300 shadow-sm'
                  : 'bg-purple-50/70 border-purple-200/70'
              }`}>
                <div className="flex items-center justify-between text-xs font-bold">
                  <span className="flex items-center gap-1.5 text-purple-900">
                    <span className="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
                    21 EMA (מפתח)
                  </span>
                  <span className="font-sans font-semibold text-purple-950">
                    {currentData.moving_averages.ema21.toLocaleString()}
                  </span>
                </div>
                <div className="flex items-center justify-between">
                  <span className={`text-2xl font-black font-sans ${
                    currentData.flags.flag_21 ? 'text-orange-600' : 'text-purple-700'
                  }`}>
                    {currentData.moving_averages.dist_21_pct > 0 ? '+' : ''}{currentData.moving_averages.dist_21_pct}%
                  </span>
                  {currentData.flags.flag_21 && (
                    <span className="bg-orange-500 text-white text-[10px] font-black px-2 py-0.5 rounded-md">
                      ⚠️ מתוח (&gt;5%)
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-purple-900/80 font-medium">קו מגמה ראשי (Trend Guide)</p>
              </div>

              <div className={`p-4 rounded-2xl border transition-all space-y-2 ${
                currentData.flags.flag_50
                  ? 'bg-red-50/90 border-red-300 shadow-sm'
                  : 'bg-blue-50/70 border-blue-200/70'
              }`}>
                <div className="flex items-center justify-between text-xs font-bold">
                  <span className="flex items-center gap-1.5 text-blue-900">
                    <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    50 SMA (מוסדי)
                  </span>
                  <span className="font-sans font-semibold text-blue-950">
                    {currentData.moving_averages.sma50.toLocaleString()}
                  </span>
                </div>
                <div className="flex items-center justify-between">
                  <span className={`text-2xl font-black font-sans ${
                    currentData.flags.flag_50 ? 'text-red-600' : 'text-blue-700'
                  }`}>
                    {currentData.moving_averages.dist_50_pct > 0 ? '+' : ''}{currentData.moving_averages.dist_50_pct}%
                  </span>
                  {currentData.flags.flag_50 && (
                    <span className="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-md">
                      🚨 מתוח (&gt;7%)
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-blue-900/80 font-medium">תמיכה מוסדית מרכזית</p>
              </div>

              <div className="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/70 space-y-2">
                <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
                  <span className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                    200 SMA
                  </span>
                  <span className="font-sans font-semibold text-slate-700">
                    {currentData.moving_averages.sma200.toLocaleString()}
                  </span>
                </div>
                <div className="text-2xl font-black text-slate-900 font-sans">
                  {currentData.moving_averages.dist_200_pct > 0 ? '+' : ''}{currentData.moving_averages.dist_200_pct}%
                </div>
                <p className="text-[11px] text-slate-500">מגמת על ארוכת טווח</p>
              </div>

              <div className="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/70 space-y-2">
                <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
                  <span>מרווח 21 מול 50</span>
                  <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">Spread</span>
                </div>
                <div className="text-2xl font-black text-slate-900 font-sans">
                  {currentData.spread_21_50_pct > 0 ? '+' : ''}{currentData.spread_21_50_pct}%
                </div>
                <p className="text-[11px] text-slate-500">מרחק בין 21 EMA ל-50 SMA</p>
              </div>
            </div>
          </div>

          {/* Interactive Chart */}
          <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 className="text-lg font-black text-slate-900">
                  גרף מדד יומי וממוצעי מפתח ({currentData.symbol_ticker})
                </h2>
                <p className="text-xs text-slate-500 font-medium">
                  תצוגת מחיר סגירה יחד עם 10 SMA, 21 EMA, 50 SMA ו-200 SMA
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-3 bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-200 text-xs font-bold">
                  <label className="flex items-center gap-1.5 cursor-pointer text-amber-700">
                    <input
                      type="checkbox"
                      checked={activeMAs.sma10}
                      onChange={e => setActiveMAs({ ...activeMAs, sma10: e.target.checked })}
                      className="rounded text-amber-500 focus:ring-0"
                    />
                    <span>10 SMA</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-purple-700">
                    <input
                      type="checkbox"
                      checked={activeMAs.ema21}
                      onChange={e => setActiveMAs({ ...activeMAs, ema21: e.target.checked })}
                      className="rounded text-purple-600 focus:ring-0"
                    />
                    <span>21 EMA</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-blue-700">
                    <input
                      type="checkbox"
                      checked={activeMAs.sma50}
                      onChange={e => setActiveMAs({ ...activeMAs, sma50: e.target.checked })}
                      className="rounded text-blue-600 focus:ring-0"
                    />
                    <span>50 SMA</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-slate-600">
                    <input
                      type="checkbox"
                      checked={activeMAs.sma200}
                      onChange={e => setActiveMAs({ ...activeMAs, sma200: e.target.checked })}
                      className="rounded text-slate-600 focus:ring-0"
                    />
                    <span>200 SMA</span>
                  </label>
                </div>

                <div className="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-bold">
                  <button
                    onClick={() => setChartRange(30)}
                    className={`px-3 py-1 rounded-xl transition ${chartRange === 30 ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}
                  >
                    30 יום
                  </button>
                  <button
                    onClick={() => setChartRange(60)}
                    className={`px-3 py-1 rounded-xl transition ${chartRange === 60 ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}
                  >
                    60 יום
                  </button>
                  <button
                    onClick={() => setChartRange(120)}
                    className={`px-3 py-1 rounded-xl transition ${chartRange === 120 ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}
                  >
                    120 יום
                  </button>
                </div>
              </div>
            </div>

            <div className="relative h-[360px] w-full pt-2">
              <canvas ref={chartCanvasRef}></canvas>
            </div>
          </div>

          {/* Market School Rules Assessment */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="lg:col-span-2 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-xl bg-cyan-100 text-cyan-600 flex items-center justify-center font-black">
                    ✓
                  </div>
                  <div>
                    <h3 className="text-base font-black text-slate-900">
                      בדיקת כללי Market School לניתוח טרנד
                    </h3>
                    <p className="text-xs text-slate-500 font-medium">
                      מעקב עמידה בקריטריונים המרכזיים של מתודולוגיית ויליאם אוניל ומייק וובסטר
                    </p>
                  </div>
                </div>
              </div>

              <div className="divide-y divide-slate-100">
                {currentData.market_school_assessment.rules.map((rule, idx) => (
                  <div key={idx} className="py-3 flex items-center justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${
                        rule.passed ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                      }`}>
                        {rule.passed ? '✓' : '✕'}
                      </span>
                      <div>
                        <div className="text-sm font-bold text-slate-800">{rule.name}</div>
                        <div className="text-xs text-slate-500">{rule.note}</div>
                      </div>
                    </div>
                    <span className={`text-xs font-black font-sans px-3 py-1 rounded-xl shrink-0 ${
                      rule.passed ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'
                    }`}>
                      {rule.val}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Overall Status & Buy/Sell signals */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-card space-y-5 flex flex-col justify-between">
              <div className="space-y-4">
                <div className="border-b border-slate-100 pb-3">
                  <h3 className="text-base font-black text-slate-900">
                    סטטוס שוק כולל (Health Status)
                  </h3>
                  <p className="text-xs text-slate-500 font-medium">
                    הערכת מצב המגמה היומית הנוכחית
                  </p>
                </div>

                <div className={`p-4 rounded-2xl border space-y-2 ${
                  currentData.market_school_assessment.color === 'green'
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-950'
                    : currentData.market_school_assessment.color === 'orange'
                    ? 'bg-orange-50 border-orange-200 text-orange-950'
                    : currentData.market_school_assessment.color === 'amber'
                    ? 'bg-amber-50 border-amber-200 text-amber-950'
                    : 'bg-rose-50 border-rose-200 text-rose-950'
                }`}>
                  <div className="text-xs font-bold uppercase tracking-wider opacity-75">
                    אבחון מודל
                  </div>
                  <div className="text-base font-black">
                    {currentData.market_school_assessment.status}
                  </div>
                  <p className="text-xs leading-relaxed font-medium">
                    {currentData.market_school_assessment.description}
                  </p>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-800">
                      איתותי קנייה / מכירה (Buy & Sell Signals)
                    </span>
                    <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-bold">
                      השלב הבא
                    </span>
                  </div>
                  <p className="text-xs text-slate-600 leading-relaxed">
                    תשתית האיתותים מוכנה להגדרה מפורטת של חוקי כניסה ויציאה (כגון שבירת 21 EMA, נרות היפוך במחזור גבוה, ימי חלוקה/צבירה מוסדיים). נדייק ונגדיר אותם יחד בשלב הבא.
                  </p>
                </div>
              </div>

              <div className="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                <span>מערכת עצמאית Market Dashboard</span>
                <span className="font-bold text-slate-700">FastAPI &amp; React</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MarketApp />);
  </script>
</body>
</html>
